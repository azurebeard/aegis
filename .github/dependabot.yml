version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # SHA-pinning policy (§6.1 SEC-M-INFRA-01): every `uses:` in
    # .github/workflows/*.yml is pinned to a commit SHA with a trailing
    # `# vX` comment. Dependabot recognises the comment and bumps both
    # the SHA and the version comment in sync on new releases.
    # Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
    groups:
      github-actions:
        patterns:
          - "*"

  # npm workspaces. Dependabot *alerts* were already enabled repository-wide,
  # but without these entries no fix PRs were ever raised — 16 open advisories
  # (10 high / 6 medium) had patched versions available and nothing to apply
  # them. Alerting and updating are separate features; both are needed.
  #
  # Security updates are deliberately NOT grouped: they must be reviewable and
  # mergeable on their own. Only routine dev-dependency bumps are batched, to
  # keep PR volume manageable across three workspaces.
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      api-dev-minor:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      web-dev-minor:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      scripts-dev-minor:
        dependency-type: "development"
        update-types: ["minor", "patch"]
